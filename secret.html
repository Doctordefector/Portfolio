<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billiards | Andrei Chapliuk</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23151515'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff'/%3E%3Ctext x='32' y='38' font-family='sans-serif' font-weight='700' font-size='16' text-anchor='middle'%3E8%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secret.css?v=5">
</head>
<body>
    <div class="glow" aria-hidden="true"><span></span><span></span></div>

    <main class="wrap">
        <header class="top">
            <a href="index.html" class="back">&larr; Back to portfolio</a>
            <button id="sound-toggle" class="icon-btn" aria-pressed="true" title="Toggle sound">🦆 Sound on</button>
        </header>

        <div class="title-row">
            <div>
                <span class="eyebrow">You found it</span>
                <h1>Billiards</h1>
                <p class="sub">Clear the table in as few shots as you can.</p>
            </div>
            <div class="hud">
                <div class="hud-item"><span id="hud-shots">0</span><small>Shots</small></div>
                <div class="hud-item"><span id="hud-left">15</span><small>Left</small></div>
                <div class="hud-item"><span id="hud-best">-</span><small>Best</small></div>
            </div>
        </div>

        <div id="game" class="game">
            <canvas id="table" aria-label="Billiards table. Drag anywhere and release to shoot."></canvas>
            <div id="toast" class="toast" role="status" aria-live="polite"></div>
            <div id="win" class="win" hidden>
                <div class="win-card">
                    <span class="eyebrow">Table cleared</span>
                    <h2 id="win-title">15 shots</h2>
                    <p id="win-best"></p>
                    <button id="play-again" class="btn btn--primary">Play again</button>
                </div>
            </div>
        </div>

        <div class="below">
            <div class="power">
                <small>Power</small>
                <div class="power-track"><div id="power-fill" class="power-fill"></div></div>
            </div>
            <div class="tray" id="tray" aria-label="Potted balls"></div>
        </div>
        <p id="last-potted" class="last-potted" aria-live="polite"></p>

        <footer class="controls">
            <p class="hint">Drag anywhere on the table and let go to shoot. Pull further for more power. Esc cancels.</p>
            <button id="reset-button" class="btn btn--ghost">New rack</button>
        </footer>
    </main>

    <script src="billiards.js?v=5"></script>
</body>
</html>
