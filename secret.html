<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Billiards</title>
    <!-- Main font import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Link to the external stylesheet -->
    <link rel="stylesheet" href="secret.css">
</head>
<body>
    <div class="secret-container">
        <h1>Secret Billiards</h1>
        <p id="billiard-instruction">Loading game...</p>
        
        <!-- Wrapper for the canvases -->
        <div id="game-container">
            <!-- Canvas for the UI overlay (cue stick) -->
            <canvas id="ui-canvas"></canvas>
            <!-- Canvas where the game will be rendered -->
            <canvas id="billiard-table"></canvas>
        </div>
        
        <div class="controls-footer">
            <a href="index.html">Go Back</a>
            <button id="reset-button">Reset Game</button>
        </div>
    </div>

    <!-- Import the physics library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <!-- Import your game script -->
    <script src="billiards.js"></script>
</body>
</html>
